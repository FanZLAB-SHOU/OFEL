name: Deploy laboratory website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static pages
        run: python3 scripts/build-site.py
      - name: Check clean URL routing
        run: python3 scripts/test-site-paths.py
      - name: Check responsive images and mobile card controls
        run: |
          python3 scripts/test-responsive-images.py
          node scripts/test-gateway-cards.cjs
      - name: Check page links and assets
        run: python3 scripts/check-site.py
      - name: Check sitemap and sharing metadata
        run: python3 scripts/check-sharing.py
      - name: Check publication search and citations
        run: |
          python3 scripts/test-publication-citations.py
          node scripts/test-publication-tools.cjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
