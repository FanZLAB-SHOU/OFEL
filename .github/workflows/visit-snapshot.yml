name: Record daily visit totals

# Busuanzi reports only running totals; one reading at 00:00 Beijing time (16:00 UTC) per day
# lets the More page chart daily visits. The commit is made with GITHUB_TOKEN, which does not
# start the Pages workflow on push, so this workflow dispatches the deployment itself.
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: visit-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Record today's Busuanzi totals
        run: python3 scripts/snapshot-busuanzi.py
      - name: Commit the snapshot
        id: commit
        run: |
          git add assets/stats/busuanzi-daily.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record daily visit totals for $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase --quiet origin main
          git push --quiet origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish the new snapshot
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
