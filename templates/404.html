<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page moved | OFEL</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 40px 20px; background: radial-gradient(ellipse at 88% 12%, #d4e5f5, transparent 65%), linear-gradient(125deg, #f2f6fa, #e4edf7); color: #172f4d; font: 450 18px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 46rem; padding: clamp(25px, 5vw, 52px); border: 1px solid #d4e0ec; border-radius: 28px; background: white; box-shadow: 0 12px 36px #14304e13; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.15; font-weight: 750; letter-spacing: -.04em; }
    p { color: #526984; }
    a { display: inline-flex; align-items: center; min-height: 46px; margin-top: 12px; padding: 11px 20px; border-radius: 999px; background: #082c55; color: white; font-weight: 650; text-decoration: none; }
    a:hover { background: #1768b5; }
    a:focus-visible { outline: 3px solid #d4a34e; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <p>Oceanic Fisheries Ecosystem Laboratory</p>
    <h1>This page has moved.</h1>
    <p id="message">Find our research, people and news from the homepage.</p>
    <a id="destination" href="./">Visit OFEL</a>
  </main>
  <script>
    const routes = {{legacy_routes}};
    const path = decodeURIComponent(location.pathname);
    const route = Object.keys(routes).sort((a, b) => b.length - a.length).find(key => path.endsWith('/' + key));
    const home = path.includes('/OFEL/') ? path.slice(0, path.indexOf('/OFEL/') + 6) : '/';
    document.getElementById('destination').href = home;
    if (route !== undefined) {
      const base = path.slice(0, -route.length);
      const target = new URL(base + routes[route], location.origin);
      target.search = location.search;
      target.hash = location.hash;
      document.getElementById('destination').href = target.href;
      document.getElementById('message').textContent = 'Taking you to the new page…';
      location.replace(target.href);
    }
  </script>
</body>
</html>
