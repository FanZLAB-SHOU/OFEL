<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page moved | OFEL</title>
  <style>
    body { margin: 0; padding: 15vh 8vw; background: #f0f6fa; color: #19314f; font: 18px/1.6 system-ui, sans-serif; }
    main { max-width: 42rem; margin: auto; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.15; }
    a { color: #225f9f; }
  </style>
</head>
<body>
  <main>
    <p>Oceanic Fisheries Ecosystem Laboratory</p>
    <h1>This page has moved.</h1>
    <p id="message">Find our research, people and news from the homepage.</p>
    <a id="destination" href="./">Visit OFEL</a>
  </main>
  <script>
    const routes = {{legacy_routes}};
    const filename = decodeURIComponent(location.pathname.split('/').pop());
    if (Object.hasOwn(routes, filename)) {
      const target = new URL(routes[filename], location.href);
      target.search = location.search;
      target.hash = location.hash;
      document.getElementById('destination').href = target.href;
      document.getElementById('message').textContent = 'Taking you to the new page…';
      location.replace(target.href);
    }
  </script>
</body>
</html>
